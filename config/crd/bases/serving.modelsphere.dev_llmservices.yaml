---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: llmservices.serving.modelsphere.dev
spec:
  group: serving.modelsphere.dev
  names:
    kind: LLMService
    listKind: LLMServiceList
    plural: llmservices
    shortNames:
    - llmsvc
    singular: llmservice
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Chart name
      jsonPath: .spec.chart.name
      name: Chart
      type: string
    - description: Resolved chart version
      jsonPath: .status.chart.version
      name: Version
      type: string
    - description: Model name
      jsonPath: .spec.model.name
      name: Model
      type: string
    - description: Reconciliation phase
      jsonPath: .status.phase
      name: Phase
      type: string
    - description: Helm release revision
      jsonPath: .status.helm.revision
      name: Revision
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          LLMService is the Schema for the llmservices API. One LLMService maps to one
          helm release in the same namespace; metadata.name is the release name.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of LLMService
            properties:
              chart:
                description: chart selects the helm chart for this release.
                properties:
                  credentialsRef:
                    description: |-
                      credentialsRef optionally names a Secret in this namespace used to pull
                      the chart and to list its versions. The Secret data must contain the
                      keys username and password. When unset, the pull and the listing are anonymous.
                    properties:
                      name:
                        description: name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  name:
                    description: name is the chart name.
                    minLength: 1
                    type: string
                  repo:
                    description: repo is the chart repository URL. It must start with
                      https:// or oci://.
                    minLength: 1
                    pattern: ^(https://|oci://).+
                    type: string
                  version:
                    description: |-
                      version is an exact chart version or a semver range. The operator
                      resolves it on first apply and pins the result on status.chart. While
                      the pinned version still satisfies the range it is kept, through other
                      spec changes and newer charts in the repository alike; a new
                      serving.modelsphere.dev/re-resolve value moves it to the newest in range.
                    minLength: 1
                    type: string
                required:
                - name
                - repo
                - version
                type: object
              deletion:
                description: |-
                  deletion tunes staged teardown. Annotations on the object override these
                  fields, and an unset field uses the built-in default. An explicit 0s is
                  a real zero (routeSettle 0s skips the settle wait).
                properties:
                  forceDeleteAfter:
                    description: |-
                      forceDeleteAfter force-deletes pods that have been terminating for this
                      long, with gracePeriodSeconds 0. The wait starts when deletion was
                      requested. Unset leaves the pods to the kubelet. The annotation
                      serving.modelsphere.dev/force-delete-after overrides this.
                    format: duration
                    type: string
                    x-kubernetes-validations:
                    - message: forceDeleteAfter must be a non-negative duration
                      rule: duration(self) >= duration('0s')
                  maxWait:
                    default: 1h
                    description: |-
                      maxWait is the budget for holding the finalizer, measured from
                      status.deletion.startedAt. Past it, remaining waits are skipped and the
                      finalizer is dropped. The annotation
                      serving.modelsphere.dev/deletion-max-wait overrides this on every pass.
                    format: duration
                    type: string
                    x-kubernetes-validations:
                    - message: maxWait must be a non-negative duration
                      rule: duration(self) >= duration('0s')
                  routeSettle:
                    default: 60s
                    description: |-
                      routeSettle is how long to wait after the ModelRoute is gone so the
                      gateway can drop it before the Services disappear. 0, via the
                      annotation serving.modelsphere.dev/route-settle, skips the wait. The
                      built-in default is 60s.
                    format: duration
                    type: string
                    x-kubernetes-validations:
                    - message: routeSettle must be a non-negative duration
                      rule: duration(self) >= duration('0s')
                type: object
              layers:
                description: |-
                  layers are helm values documents merged in order, last writer wins.
                  Names are unique so each layer can be owned separately under
                  server-side apply. Order is the meaning of the list, so one writer
                  should own the whole list. An empty list is valid and leaves the
                  chart defaults in place.
                items:
                  description: Layer is one values document. Layers merge in list
                    order, last writer wins.
                  properties:
                    name:
                      description: name identifies this layer. Names must be unique
                        within spec.layers.
                      minLength: 1
                      type: string
                    values:
                      description: values is a schemaless object of helm values contributed
                        by this layer.
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              model:
                description: |-
                  model is descriptive metadata for the served model. It is not used to
                  render the chart.
                properties:
                  engine:
                    description: engine is the inference engine, such as sglang or
                      vllm.
                    type: string
                  hf:
                    description: hf is the Hugging Face repository id.
                    type: string
                  name:
                    description: name of the model.
                    type: string
                  variant:
                    description: variant is the serving variant, such as a parallelism
                      and hardware profile.
                    type: string
                  version:
                    description: version of the model.
                    type: string
                type: object
              suspend:
                description: |-
                  suspend stops reconciliation. The status keeps the last outcome.
                  Suspend wins over deletion: a suspended object that is deleting is left
                  as it is, including its finalizer.
                type: boolean
            required:
            - chart
            type: object
          status:
            description: status defines the observed state of LLMService
            properties:
              appliedHash:
                description: appliedHash is a digest over status.chart and the merged
                  layers.
                type: string
              chart:
                description: |-
                  chart is the chart name and the exact version spec.chart.version
                  resolved to.
                properties:
                  name:
                    description: name is the chart name that was resolved.
                    type: string
                  reResolve:
                    description: |-
                      reResolve is the serving.modelsphere.dev/re-resolve value already
                      honored. Only a different non-empty value re-resolves.
                    type: string
                  version:
                    description: version is the exact chart version resolved from
                      spec.chart.version.
                    type: string
                type: object
              conditions:
                description: |-
                  conditions represent the current state of the LLMService.
                  Types used by the operator are Applied and Adopted.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              deletion:
                description: deletion is the staged teardown observed while the object
                  is deleting.
                properties:
                  deadline:
                    description: |-
                      deadline is startedAt plus the effective maxWait. It is recomputed when
                      the annotation or the spec changes.
                    format: date-time
                    type: string
                  forceDeleted:
                    description: forceDeleted are pod names deleted with gracePeriodSeconds
                      0. Capped at 20.
                    items:
                      type: string
                    maxItems: 20
                    type: array
                  message:
                    description: |-
                      message is a human-readable line, for example
                      "waiting for 3 pods (2 stuck on NotReady node gpu-7)".
                    type: string
                  outcome:
                    description: outcome is how teardown finished, or the non-clean
                      result already known.
                    enum:
                    - Clean
                    - NoRoute
                    - RouteStuck
                    - PodsForceDeleted
                    - TimedOut
                    type: string
                  pods:
                    description: |-
                      pods are the release pods still in the API, ignoring Succeeded and Failed.
                      The list is capped at 20.
                    items:
                      description: DeletionPod is one release pod observed during
                        teardown.
                      properties:
                        deletionTimestamp:
                          description: deletionTimestamp is the pod's metadata.deletionTimestamp.
                          format: date-time
                          type: string
                        grace:
                          description: grace is the pod's terminationGracePeriodSeconds.
                            30 when the pod does not set one.
                          format: int64
                          type: integer
                        name:
                          description: name of the pod.
                          type: string
                        node:
                          description: node is the node the pod is assigned to.
                          type: string
                        phase:
                          description: phase is the pod phase.
                          type: string
                        stuck:
                          description: |-
                            stuck is true when the pod is past its grace on a NotReady or missing
                            node, or past grace plus 5m, and no longer blocks the finalizer.
                          type: boolean
                      required:
                      - name
                      type: object
                    maxItems: 20
                    type: array
                  podsGoneAt:
                    description: podsGoneAt is when no release pods were left to wait
                      for.
                    format: date-time
                    type: string
                  podsRemaining:
                    description: podsRemaining is how many release pods still block
                      the finalizer.
                    format: int32
                    type: integer
                  routeRemovedAt:
                    description: routeRemovedAt is when the ModelRoute was first observed
                      NotFound.
                    format: date-time
                    type: string
                  stage:
                    description: stage is the current teardown stage. It only moves
                      forward.
                    enum:
                    - RouteRemoving
                    - RouteSettling
                    - Uninstalling
                    - PodsTerminating
                    - ForceDeleting
                    - Released
                    type: string
                  startedAt:
                    description: startedAt is when staged deletion began.
                    format: date-time
                    type: string
                  uninstalledAt:
                    description: uninstalledAt is when the helm uninstall succeeded.
                    format: date-time
                    type: string
                type: object
              helm:
                description: helm is the release revision and status last observed.
                properties:
                  revision:
                    description: revision is the helm release revision.
                    type: integer
                  status:
                    description: status is the helm release status, such as deployed.
                    type: string
                type: object
              history:
                description: |-
                  history records applies, newest first. The controller keeps the most
                  recent DefaultHistoryLimit (10) entries.
                items:
                  description: HistoryEntry records one applied revision. status.history
                    is newest first.
                  properties:
                    action:
                      description: |-
                        action is the swiss action copied for this revision (install, upgrade,
                        rollback, or migrate), when one was set.
                      type: string
                    annotations:
                      additionalProperties:
                        type: string
                      description: |-
                        annotations are the swiss.modelsphere.dev/* annotations copied from the
                        LLMService when this revision was recorded.
                      type: object
                    appliedAt:
                      description: appliedAt is when this revision was recorded.
                      format: date-time
                      type: string
                    controllerRevision:
                      description: |-
                        controllerRevision is the name of the ControllerRevision that stores
                        the spec snapshot for this revision.
                      type: string
                    forceConflicts:
                      description: |-
                        forceConflicts records that this apply honored
                        serving.modelsphere.dev/force-conflicts for its generation.
                      type: boolean
                    hash:
                      description: hash is the appliedHash at this revision.
                      type: string
                    reResolved:
                      description: |-
                        reResolved records that this apply honored a new
                        serving.modelsphere.dev/re-resolve value rather than the pinned version.
                      type: boolean
                    revision:
                      description: revision is the helm release revision this entry
                        records.
                      type: integer
                  required:
                  - appliedAt
                  - controllerRevision
                  - hash
                  - revision
                  type: object
                type: array
              message:
                description: message is the helm error when phase is Failed, and empty
                  otherwise.
                type: string
              observedGeneration:
                description: |-
                  observedGeneration is the metadata.generation last reconciled to a
                  terminal outcome.
                format: int64
                type: integer
              phase:
                description: |-
                  phase is the current reconciliation phase: Pending, Applying, Applied,
                  Failed, or Deleting.
                enum:
                - Pending
                - Applying
                - Applied
                - Failed
                - Deleting
                type: string
              releaseUID:
                description: |-
                  releaseUID is the UID of the LLMService that claimed this helm release.
                  The controller writes it before install, and again on adopt and on every
                  successful apply. Ownership is this value equal to metadata.uid, or the
                  release label serving.modelsphere.dev/llmservice-uid equal to that uid.
                  A later condition change does not drop the claim.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
