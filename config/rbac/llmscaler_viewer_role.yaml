# This rule is not used by the project llmscaleoperator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to autoscaling.4pd.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: llmscaleoperator
    app.kubernetes.io/managed-by: kustomize
  name: llmscaler-viewer-role
rules:
- apiGroups:
  - autoscaling.4pd.io
  resources:
  - llmscalers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - autoscaling.4pd.io
  resources:
  - llmscalers/status
  verbs:
  - get
