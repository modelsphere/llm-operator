# This rule is not used by the project llmscaleoperator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over serving.modelsphere.dev.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: llmscaleoperator
    app.kubernetes.io/managed-by: kustomize
  name: serving-llmservice-admin-role
rules:
- apiGroups:
  - serving.modelsphere.dev
  resources:
  - llmservices
  verbs:
  - '*'
- apiGroups:
  - serving.modelsphere.dev
  resources:
  - llmservices/status
  verbs:
  - get
