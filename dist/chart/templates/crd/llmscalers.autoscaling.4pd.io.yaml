{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.21.0
  name: llmscalers.autoscaling.4pd.io
spec:
  group: autoscaling.4pd.io
  names:
    kind: LLMScaler
    listKind: LLMScalerList
    plural: llmscalers
    singular: llmscaler
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: The lower limit for the number of replicas
      jsonPath: .spec.minReplicas
      name: MinReplicas
      type: integer
    - description: The upper limit for the number of replicas
      jsonPath: .spec.maxReplicas
      name: MaxReplicas
      type: integer
    - description: The current number of replicas
      jsonPath: .status.currentReplicas
      name: CurrentReplicas
      type: integer
    - description: The desired number of replicas
      jsonPath: .status.desiredReplicas
      name: DesiredReplicas
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: LLMScaler is the Schema for the llmscalers API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of LLMScaler
            properties:
              maxReplicas:
                description: maxReplicas is the upper limit for the number of replicas
                  to which the autoscaler can scale up
                format: int32
                minimum: 1
                type: integer
              metrics:
                description: metrics contains the specifications for which to use
                  to calculate the desired replica count
                items:
                  description: MetricSpec defines a Prometheus query and the target
                    value to scale on.
                  properties:
                    name:
                      description: name is an optional identifier for this metric,
                        used in logs and events.
                      type: string
                    query:
                      description: |-
                        query is a PromQL instant query returning the current metric value as a
                        single (averaged) scalar. Scaling compares it to target as
                          desiredReplicas = ceil(readyReplicas * value / target)
                        so it should be a per-replica value — e.g. wrap it in avg(...). Bake any
                        label filters into the query. Example:
                          avg(vllm:kv_cache_usage_perc{model_name="opt-125m"})
                      type: string
                    target:
                      description: |-
                        target is the desired per-replica value of the query result. When the
                        measured value exceeds target, replicas scale up proportionally.
                      type: string
                  required:
                  - query
                  - target
                  type: object
                type: array
              minReplicas:
                description: minReplicas is the lower limit for the number of replicas
                  to which the autoscaler can scale down
                format: int32
                minimum: 1
                type: integer
              preemption:
                description: preemption defines whether priority-based preemption
                  is enabled
                properties:
                  enable:
                    type: boolean
                  priorityClass:
                    type: string
                type: object
              retryPeriodSeconds:
                default: 10
                description: retryPeriodSeconds is the interval at which the autoscaler
                  retries when an error occurs or target is not found. Defaults to
                  10.
                format: int32
                type: integer
              scaleDown:
                description: scaleDown defines the behavior for scaling down, e.g.
                  cache-aware teardown
                properties:
                  behavior:
                    default: CacheAware
                    description: |-
                      behavior controls how pods are chosen when scaling down.
                      "CacheAware" (default) biases removal toward the coldest-cache pods by
                      setting a low controller.kubernetes.io/pod-deletion-cost on the pods being
                      removed, so the ReplicaSet deletes them first. This is best-effort and only
                      applies to Deployment/ReplicaSet targets — StatefulSet/LWS scale-down is
                      ordinal-based and ignores the hint. "None" opts out and uses the workload
                      controller's default deletion order.
                    enum:
                    - CacheAware
                    - None
                    type: string
                  deletionCostQuery:
                    description: |-
                      deletionCostQuery is an optional PromQL instant query used to compute each
                      pod's controller.kubernetes.io/pod-deletion-cost at scale-down time (only
                      applies when behavior is CacheAware). It is evaluated against
                      spec.serverAddress and must return one series per pod
                      carrying a "pod" label; the sample value becomes that pod's deletion cost.
                      Lower cost is deleted first, so the expression should yield lower numbers
                      for colder / less valuable pods (e.g. "vllm:kv_cache_usage_perc * 100").
                      When empty, a newest-pod-first heuristic is used instead.
                    type: string
                  stabilizationWindowSeconds:
                    description: stabilizationWindowSeconds is reserved for smoothing
                      scale-down decisions.
                    format: int32
                    type: integer
                type: object
              serverAddress:
                description: serverAddress is the Prometheus query endpoint (e.g.
                  http://prometheus:9090)
                type: string
              serverHeaders:
                additionalProperties:
                  type: string
                description: |-
                  serverHeaders are additional HTTP headers sent with every metric-fetch
                  request to Prometheus (e.g. Authorization for a secured endpoint). Values
                  are used verbatim.
                type: object
              syncPeriodSeconds:
                default: 15
                description: syncPeriodSeconds is the interval at which the autoscaler
                  evaluates metrics and scales. Defaults to 15.
                format: int32
                type: integer
              targetRef:
                description: targetRef points to the resource (e.g., Deployment) to
                  scale
                properties:
                  apiVersion:
                    type: string
                  kind:
                    type: string
                  name:
                    type: string
                required:
                - apiVersion
                - kind
                - name
                type: object
            required:
            - maxReplicas
            - metrics
            - minReplicas
            - serverAddress
            - targetRef
            type: object
          status:
            description: status defines the observed state of LLMScaler
            properties:
              conditions:
                description: conditions represent the current state of the LLMScaler
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentReplicas:
                description: currentReplicas is the current number of replicas of
                  pods managed by this autoscaler
                format: int32
                type: integer
              desiredReplicas:
                description: desiredReplicas is the desired number of replicas of
                  pods managed by this autoscaler
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
