                format: int64
                type: integer
              phase:
                description: |-
                  phase is the current reconciliation phase: Pending, Applying, Applied,
                  or Failed.
                enum:
                - Pending
                - Applying
                - Applied
                - Failed
                type: string
            type: object
        required:
        - spec
        type: object
