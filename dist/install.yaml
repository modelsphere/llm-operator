                      type: string
                    forceConflicts:
                      description: |-
                        forceConflicts records that this apply honored
                        serving.modelsphere.dev/force-conflicts for its generation.
                      type: boolean
                    hash:
                      description: hash is the appliedHash at this revision.
                      type: string
                    revision:
                      description: revision is the helm release revision this entry
                        records.
                      type: integer
                  required:
                  - appliedAt
                  - controllerRevision
                  - hash
                  - revision
                  type: object
                type: array
              message:
                description: message is the helm error when phase is Failed, and empty
