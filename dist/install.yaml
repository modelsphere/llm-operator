apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: llmscaleoperator
    control-plane: controller-manager
  name: llmscaleoperator-system
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: llmscalers.autoscaling.modelsphere.dev
spec:
  group: autoscaling.modelsphere.dev
  names:
    kind: LLMScaler
    listKind: LLMScalerList
    plural: llmscalers
    singular: llmscaler
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: The lower limit for the number of replicas
      jsonPath: .spec.minReplicas
      name: MinReplicas
      type: integer
    - description: The upper limit for the number of replicas
      jsonPath: .spec.maxReplicas
      name: MaxReplicas
      type: integer
    - description: The current number of replicas
      jsonPath: .status.currentReplicas
      name: CurrentReplicas
      type: integer
    - description: The desired number of replicas
      jsonPath: .status.desiredReplicas
      name: DesiredReplicas
      type: integer
    - description: Whether a usable scaling signal was received
      jsonPath: .status.conditions[?(@.type=="ScalingActive")].status
      name: Active
      type: string
    - description: Whether this sync could scale the target
      jsonPath: .status.conditions[?(@.type=="AbleToScale")].status
      name: AbleToScale
      type: string
    - description: 'The AbleToScale reason: Synced, a guard hold (RolloutInProgress,
        ScaleDownSettling), DeferralTimedOut, ScaleDownStabilized while the stabilization
        window keeps the count, or a failure'
      jsonPath: .status.conditions[?(@.type=="AbleToScale")].reason
      name: Scaling
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: LLMScaler is the Schema for the llmscalers API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of LLMScaler
            properties:
              customProvider:
                description: |-
                  customProvider configures the Custom metric provider. Required when
                  metricProvider is Custom, ignored otherwise.
                properties:
                  namespace:
                    description: |-
                      namespace optionally narrows the match to decisions carrying this
                      namespace, for a server that reports the same serviceId in several. When
                      empty, serviceId alone selects the decision — and a serviceId matching
                      more than one decision is an error rather than a choice, so set this if
                      the server ever reports duplicates.
                    type: string
                  path:
                    default: /decisions
                    description: path is the request path on serverAddress. Defaults
                      to /decisions.
                    type: string
                  serviceId:
                    description: |-
                      serviceId names the service whose decision to read. It is sent as the
                      serviceId query parameter and is also matched against
                      decisions[].serviceId in the reply, since the server is free to answer
                      with more than it was asked for.
                    type: string
                required:
                - serviceId
                type: object
              deferTimeoutSeconds:
                default: 600
                description: |-
                  deferTimeoutSeconds bounds how long the rollout or settle guard may hold
                  a scale action back. Once it has been deferred this long, measured from
                  status.deferredSince, the held write is applied anyway (still capped by
                  scaleDown.maxStepReplicas) and a DeferralTimedOut warning event is
                  emitted. That write does not restart the clock: while a guard still
                  matches, later steps proceed at the sync pace instead of waiting out
                  the timeout again. The clock is cleared only when a sync finds no guard
                  matching. 0 never forces, so the guards may then defer indefinitely.
                  Defaults to 600.
                format: int32
                minimum: 0
                type: integer
              maxReplicas:
                description: |-
                  maxReplicas is the upper limit for the number of replicas to which the
                  autoscaler can scale up. 0 pins the fleet at zero replicas, which
                  combined with minReplicas: 0 disables scaling entirely.
                format: int32
                minimum: 0
                type: integer
              metricProvider:
                default: Prometheus
                description: |-
                  metricProvider selects where the scaling signal comes from.
                  "Prometheus" (default) evaluates spec.metrics as PromQL against
                  spec.serverAddress and derives replicas from them. "Custom" ignores
                  spec.metrics entirely and reads a replica count straight off the decision
                  server described by spec.customProvider — the two are alternatives, not
                  layers, and there is no fallback from one to the other.
                enum:
                - Prometheus
                - Custom
                type: string
              metrics:
                description: |-
                  metrics contains the specifications for which to use to calculate the
                  desired replica count. Required (and non-empty) under the Prometheus
                  provider; ignored under Custom, which gets its recommendation from the
                  decision server instead.
                items:
                  description: MetricSpec defines a Prometheus query and the target
                    value to scale on.
                  properties:
                    name:
                      description: name is an optional identifier for this metric,
                        used in logs and events.
                      type: string
                    query:
                      description: |-
                        query is a PromQL instant query returning the current metric value as a
                        single (averaged) scalar. Scaling compares it to target as
                          desiredReplicas = ceil(readyReplicas * value / target)
                        so it should be a per-replica value — e.g. wrap it in avg(...). Bake any
                        label filters into the query. Example:
                          avg(vllm:kv_cache_usage_perc{model_name="opt-125m"})
                        A result of more than one series is an error, not a sample to pick from:
                        aggregate away every label the source varies on (backend, model, route,
                        pod). A query that errors, returns no data, or returns NaN/Inf is skipped
                        for that sync rather than read as zero; if every metric is skipped the
                        replica count is held at spec.replicas, apart from the min/max bounds.
                      type: string
                    target:
                      description: |-
                        target is the desired per-replica value of the query result. When the
                        measured value exceeds target, replicas scale up proportionally. It must be
                        a finite positive number on the same scale as the query — a "%" suffix is
                        rejected, since "80%" cannot be resolved without knowing whether the query
                        returns a 0-1 fraction (write "0.8") or a 0-100 percentage (write "80").
                      type: string
                  required:
                  - query
                  - target
                  type: object
                type: array
              minReplicas:
                description: |-
                  minReplicas is the lower limit for the number of replicas to which the
                  autoscaler can scale down. 0 enables scale-to-zero: an idle target is
                  scaled all the way down, and wakes back up when a metric evaluates to a
                  positive recommendation (under the Prometheus provider the ratio is then
                  computed against a single-replica baseline, since a fleet of zero has no
                  per-replica measurement to scale off).
                format: int32
                minimum: 0
                type: integer
              preemption:
                description: preemption defines whether priority-based preemption
                  is enabled
                properties:
                  enable:
                    type: boolean
                  priorityClass:
                    type: string
                type: object
              retryPeriodSeconds:
                default: 10
                description: retryPeriodSeconds is the interval at which the autoscaler
                  retries when an error occurs or target is not found. Defaults to
                  10.
                format: int32
                type: integer
              scaleDown:
                description: scaleDown defines the behavior for scaling down, e.g.
                  cache-aware teardown
                properties:
                  behavior:
                    default: CacheAware
                    description: |-
                      behavior controls how pods are chosen when scaling down.
                      "CacheAware" (default) biases removal toward the coldest-cache pods by
                      setting a low controller.kubernetes.io/pod-deletion-cost on the pods being
                      removed, so the ReplicaSet deletes them first. This is best-effort and only
                      applies to Deployment/ReplicaSet targets — StatefulSet/LWS scale-down is
                      ordinal-based and ignores the hint. "None" opts out and uses the workload
                      controller's default deletion order.
                    enum:
                    - CacheAware
                    - None
                    type: string
                  deletionCostQuery:
                    description: |-
                      deletionCostQuery is an optional PromQL instant query used to compute each
                      pod's controller.kubernetes.io/pod-deletion-cost at scale-down time (only
                      applies when behavior is CacheAware). It is evaluated against
                      spec.serverAddress and must return one series per pod
                      carrying a "pod" label; the sample value becomes that pod's deletion cost.
                      Lower cost is deleted first, so the expression should yield lower numbers
                      for colder / less valuable pods (e.g. "vllm:kv_cache_usage_perc * 100").
                      When empty, a newest-pod-first heuristic is used instead. It is PromQL, so
                      it is only consulted under the Prometheus metric provider — under Custom,
                      spec.serverAddress is a decision server with no query API, and the
                      heuristic is used regardless of what is set here.
                    type: string
                  maxStepReplicas:
                    description: |-
                      maxStepReplicas caps how many replicas a single scale-down step may remove,
                      so the fleet shrinks gradually instead of dropping straight from N to
                      minReplicas when the metric collapses. It bounds the size of a step, not how
                      often one happens: the next scale-down also waits for the previous one to
                      settle, so steps are at least syncPeriodSeconds apart and can be further
                      apart while the target is still converging. A full descent therefore takes
                      roughly ceil((current-minReplicas)/maxStepReplicas) steps at that spacing —
                      on a slow-settling workload prefer a larger step. It rate-limits the write
                      only:
                      status.desiredReplicas keeps reporting the uncapped recommendation, and
                      subsequent syncs keep stepping toward it until they meet. Scaling never goes
                      below minReplicas, and scale-up is unaffected. 0 (default) means unlimited —
                      scale down straight to the recommendation.
                    format: int32
                    minimum: 0
                    type: integer
                  stabilizationWindowSeconds:
                    description: |-
                      stabilizationWindowSeconds dampens scale-down: replicas are held at the
                      highest recommendation seen within this many seconds, so a brief metric dip
                      doesn't shrink the fleet. Scale-up is immediate. 0 disables stabilization.
                    format: int32
                    type: integer
                type: object
              serverAddress:
                description: |-
                  serverAddress is the metric source endpoint: the Prometheus query API
                  (e.g. http://prometheus:9090) under the Prometheus provider, or the
                  decision server's base URL (e.g. http://decisions:80) under Custom.
                type: string
              serverHeaders:
                additionalProperties:
                  type: string
                description: |-
                  serverHeaders are additional HTTP headers sent with every metric-fetch
                  request to the metric source (e.g. Authorization for a secured endpoint).
                  Values are used verbatim.
                type: object
              syncPeriodSeconds:
                default: 15
                description: syncPeriodSeconds is the interval at which the autoscaler
                  evaluates metrics and scales. Defaults to 15.
                format: int32
                type: integer
              targetRef:
                description: targetRef points to the resource (e.g., Deployment) to
                  scale
                properties:
                  apiVersion:
                    type: string
                  kind:
                    type: string
                  name:
                    type: string
                required:
                - apiVersion
                - kind
                - name
                type: object
            required:
            - maxReplicas
            - minReplicas
            - serverAddress
            - targetRef
            type: object
            x-kubernetes-validations:
            - message: spec.metrics must be non-empty unless spec.metricProvider is
                Custom
              rule: (has(self.metricProvider) && self.metricProvider == 'Custom')
                || (has(self.metrics) && size(self.metrics) > 0)
            - message: spec.customProvider is required when spec.metricProvider is
                Custom
              rule: '!(has(self.metricProvider) && self.metricProvider == ''Custom'')
                || has(self.customProvider)'
          status:
            description: status defines the observed state of LLMScaler
            properties:
              appliedReplicas:
                description: |-
                  appliedReplicas is the target's spec.replicas after this sync: the value
                  just written, or the unchanged value when the sync deferred or had nothing
                  to do.
                format: int32
                type: integer
              conditions:
                description: |-
                  conditions represent the current state of the LLMScaler resource:
                  AbleToScale, ScalingActive, and ScalingLimited. DecisionAvailable is
                  deprecated and mirrors ScalingActive.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentReplicas:
                description: currentReplicas is the current number of replicas of
                  pods managed by this autoscaler
                format: int32
                type: integer
              deferredSince:
                description: |-
                  deferredSince is when the current deferral started. It is set on the first
                  sync that holds a scale action back. It is kept across guard reason
                  changes, across no-op syncs while a guard still matches, and across
                  forced writes. It is cleared only when a sync finds no guard matching:
                  a normal write, or a no-op with no guard. A no-op does not start it.
                  It lives in status so it survives operator restarts.
                format: date-time
                type: string
              desiredReplicas:
                description: desiredReplicas is the desired number of replicas of
                  pods managed by this autoscaler
                format: int32
                type: integer
              lastScaleTime:
                description: |-
                  lastScaleTime is when the controller last successfully wrote
                  spec.replicas on the target, taken from the reconciler clock. It is set
                  on a normal write and on a write forced after the deferral timeout, and
                  left unchanged on every other sync: a no-op, a deferral, pacing, or an
                  error.
                format: date-time
                type: string
              observedGeneration:
                description: |-
                  observedGeneration is the most recent generation observed by the
                  controller. It is set to metadata.generation on every status write.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: llmservices.serving.modelsphere.dev
spec:
  group: serving.modelsphere.dev
  names:
    kind: LLMService
    listKind: LLMServiceList
    plural: llmservices
    shortNames:
    - llmsvc
    singular: llmservice
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Chart name
      jsonPath: .spec.chart.name
      name: Chart
      type: string
    - description: Resolved chart version
      jsonPath: .status.chart.version
      name: Version
      type: string
    - description: Model name
      jsonPath: .spec.model.name
      name: Model
      type: string
    - description: Reconciliation phase
      jsonPath: .status.phase
      name: Phase
      type: string
    - description: Helm release revision
      jsonPath: .status.helm.revision
      name: Revision
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          LLMService is the Schema for the llmservices API. One LLMService maps to one
          helm release in the same namespace; metadata.name is the release name.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of LLMService
            properties:
              chart:
                description: chart selects the helm chart for this release.
                properties:
                  credentialsRef:
                    description: |-
                      credentialsRef optionally names a Secret in this namespace used to pull
                      the chart and to list its versions. The Secret data must contain the
                      keys username and password. When unset, the pull and the listing are anonymous.
                    properties:
                      name:
                        description: name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  name:
                    description: name is the chart name.
                    minLength: 1
                    type: string
                  repo:
                    description: repo is the chart repository URL. It must start with
                      https:// or oci://.
                    minLength: 1
                    pattern: ^(https://|oci://).+
                    type: string
                  version:
                    description: |-
                      version is an exact chart version or a semver range. The operator
                      resolves it on first apply and pins the result on status.chart. While
                      the pinned version still satisfies the range it is kept, through other
                      spec changes and newer charts in the repository alike; a new
                      serving.modelsphere.dev/re-resolve value moves it to the newest in range.
                    minLength: 1
                    type: string
                required:
                - name
                - repo
                - version
                type: object
              deletion:
                description: |-
                  deletion tunes staged teardown. Annotations on the object override these
                  fields, and an unset field uses the built-in default. An explicit 0s is
                  a real zero (routeSettle 0s skips the settle wait).
                properties:
                  forceDeleteAfter:
                    description: |-
                      forceDeleteAfter force-deletes pods that have been terminating for this
                      long, with gracePeriodSeconds 0. The wait starts when deletion was
                      requested. Unset leaves the pods to the kubelet. The annotation
                      serving.modelsphere.dev/force-delete-after overrides this.
                    format: duration
                    type: string
                    x-kubernetes-validations:
                    - message: forceDeleteAfter must be a non-negative duration
                      rule: duration(self) >= duration('0s')
                  maxWait:
                    default: 1h
                    description: |-
                      maxWait is the budget for holding the finalizer, measured from
                      status.deletion.startedAt. Past it, remaining waits are skipped and the
                      finalizer is dropped. The annotation
                      serving.modelsphere.dev/deletion-max-wait overrides this on every pass.
                    format: duration
                    type: string
                    x-kubernetes-validations:
                    - message: maxWait must be a non-negative duration
                      rule: duration(self) >= duration('0s')
                  routeSettle:
                    default: 60s
                    description: |-
                      routeSettle is how long to wait after the ModelRoute is gone so the
                      gateway can drop it before the Services disappear. 0, via the
                      annotation serving.modelsphere.dev/route-settle, skips the wait. The
                      built-in default is 60s.
                    format: duration
                    type: string
                    x-kubernetes-validations:
                    - message: routeSettle must be a non-negative duration
                      rule: duration(self) >= duration('0s')
                type: object
              layers:
                description: |-
                  layers are helm values documents merged in order, last writer wins.
                  Names are unique so each layer can be owned separately under
                  server-side apply. Order is the meaning of the list, so one writer
                  should own the whole list. An empty list is valid and leaves the
                  chart defaults in place.
                items:
                  description: Layer is one values document. Layers merge in list
                    order, last writer wins.
                  properties:
                    name:
                      description: name identifies this layer. Names must be unique
                        within spec.layers.
                      minLength: 1
                      type: string
                    values:
                      description: values is a schemaless object of helm values contributed
                        by this layer.
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              model:
                description: |-
                  model is descriptive metadata for the served model. It is not used to
                  render the chart.
                properties:
                  engine:
                    description: engine is the inference engine, such as sglang or
                      vllm.
                    type: string
                  hf:
                    description: hf is the Hugging Face repository id.
                    type: string
                  name:
                    description: name of the model.
                    type: string
                  variant:
                    description: variant is the serving variant, such as a parallelism
                      and hardware profile.
                    type: string
                  version:
                    description: version of the model.
                    type: string
                type: object
              suspend:
                description: |-
                  suspend stops reconciliation. The status keeps the last outcome.
                  Suspend wins over deletion: a suspended object that is deleting is left
                  as it is, including its finalizer.
                type: boolean
            required:
            - chart
            type: object
          status:
            description: status defines the observed state of LLMService
            properties:
              appliedHash:
                description: appliedHash is a digest over status.chart and the merged
                  layers.
                type: string
              chart:
                description: |-
                  chart is the chart name and the exact version spec.chart.version
                  resolved to.
                properties:
                  name:
                    description: name is the chart name that was resolved.
                    type: string
                  reResolve:
                    description: |-
                      reResolve is the serving.modelsphere.dev/re-resolve value already
                      honored. Only a different non-empty value re-resolves.
                    type: string
                  version:
                    description: version is the exact chart version resolved from
                      spec.chart.version.
                    type: string
                type: object
              conditions:
                description: |-
                  conditions represent the current state of the LLMService.
                  Types used by the operator are Applied and Adopted.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              deletion:
                description: deletion is the staged teardown observed while the object
                  is deleting.
                properties:
                  deadline:
                    description: |-
                      deadline is startedAt plus the effective maxWait. It is recomputed when
                      the annotation or the spec changes.
                    format: date-time
                    type: string
                  forceDeleted:
                    description: forceDeleted are pod names deleted with gracePeriodSeconds
                      0. Capped at 20.
                    items:
                      type: string
                    maxItems: 20
                    type: array
                  message:
                    description: |-
                      message is a human-readable line, for example
                      "waiting for 3 pods (2 stuck on NotReady node gpu-7)".
                    type: string
                  outcome:
                    description: outcome is how teardown finished, or the non-clean
                      result already known.
                    enum:
                    - Clean
                    - NoRoute
                    - RouteStuck
                    - PodsForceDeleted
                    - TimedOut
                    type: string
                  pods:
                    description: |-
                      pods are the release pods still in the API, ignoring Succeeded and Failed.
                      The list is capped at 20.
                    items:
                      description: DeletionPod is one release pod observed during
                        teardown.
                      properties:
                        deletionTimestamp:
                          description: deletionTimestamp is the pod's metadata.deletionTimestamp.
                          format: date-time
                          type: string
                        grace:
                          description: grace is the pod's terminationGracePeriodSeconds.
                            30 when the pod does not set one.
                          format: int64
                          type: integer
                        name:
                          description: name of the pod.
                          type: string
                        node:
                          description: node is the node the pod is assigned to.
                          type: string
                        phase:
                          description: phase is the pod phase.
                          type: string
                        stuck:
                          description: |-
                            stuck is true when the pod is past its grace on a NotReady or missing
                            node, or past grace plus 5m, and no longer blocks the finalizer.
                          type: boolean
                      required:
                      - name
                      type: object
                    maxItems: 20
                    type: array
                  podsGoneAt:
                    description: podsGoneAt is when no release pods were left to wait
                      for.
                    format: date-time
                    type: string
                  podsRemaining:
                    description: podsRemaining is how many release pods still block
                      the finalizer.
                    format: int32
                    type: integer
                  routeRemovedAt:
                    description: routeRemovedAt is when the ModelRoute was first observed
                      NotFound.
                    format: date-time
                    type: string
                  stage:
                    description: stage is the current teardown stage. It only moves
                      forward.
                    enum:
                    - RouteRemoving
                    - RouteSettling
                    - Uninstalling
                    - PodsTerminating
                    - ForceDeleting
                    - Released
                    type: string
                  startedAt:
                    description: startedAt is when staged deletion began.
                    format: date-time
                    type: string
                  uninstalledAt:
                    description: uninstalledAt is when the helm uninstall succeeded.
                    format: date-time
                    type: string
                type: object
              helm:
                description: helm is the release revision and status last observed.
                properties:
                  revision:
                    description: revision is the helm release revision.
                    type: integer
                  status:
                    description: status is the helm release status, such as deployed.
                    type: string
                type: object
              history:
                description: |-
                  history records applies, newest first. The controller keeps the most
                  recent DefaultHistoryLimit (10) entries.
                items:
                  description: HistoryEntry records one applied revision. status.history
                    is newest first.
                  properties:
                    action:
                      description: |-
                        action is the swiss action copied for this revision (install, upgrade,
                        rollback, or migrate), when one was set.
                      type: string
                    annotations:
                      additionalProperties:
                        type: string
                      description: |-
                        annotations are the swiss.modelsphere.dev/* annotations copied from the
                        LLMService when this revision was recorded.
                      type: object
                    appliedAt:
                      description: appliedAt is when this revision was recorded.
                      format: date-time
                      type: string
                    controllerRevision:
                      description: |-
                        controllerRevision is the name of the ControllerRevision that stores
                        the spec snapshot for this revision.
                      type: string
                    forceConflicts:
                      description: |-
                        forceConflicts records that this apply honored
                        serving.modelsphere.dev/force-conflicts for its generation.
                      type: boolean
                    hash:
                      description: hash is the appliedHash at this revision.
                      type: string
                    reResolved:
                      description: |-
                        reResolved records that this apply honored a new
                        serving.modelsphere.dev/re-resolve value rather than the pinned version.
                      type: boolean
                    revision:
                      description: revision is the helm release revision this entry
                        records.
                      type: integer
                  required:
                  - appliedAt
                  - controllerRevision
                  - hash
                  - revision
                  type: object
                type: array
              message:
                description: message is the helm error when phase is Failed, and empty
                  otherwise.
                type: string
              observedGeneration:
                description: |-
                  observedGeneration is the metadata.generation last reconciled to a
                  terminal outcome.
                format: int64
                type: integer
              phase:
                description: |-
                  phase is the current reconciliation phase: Pending, Applying, Applied,
                  Failed, or Deleting.
                enum:
                - Pending
                - Applying
                - Applied
                - Failed
                - Deleting
                type: string
              releaseUID:
                description: |-
                  releaseUID is the UID of the LLMService that claimed this helm release.
                  The controller writes it before install, and again on adopt and on every
                  successful apply. Ownership is this value equal to metadata.uid, or the
                  release label serving.modelsphere.dev/llmservice-uid equal to that uid.
                  A later condition change does not drop the claim.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
