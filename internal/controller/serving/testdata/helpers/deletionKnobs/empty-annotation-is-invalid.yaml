name: empty-annotation-is-invalid
description: an empty annotation falls back to the default
inputs:
  annotations:
    serving.modelsphere.dev/deletion-max-wait: ""
expected:
  maxWait: 1h
  routeSettle: 60s
  forceOff: true
  invalid:
    - key: serving.modelsphere.dev/deletion-max-wait
      contains: invalid duration
