name: passes-skip-schema-validation-to-helm
description: passes the skip-schema-validation annotation to the install and the upgrade it is set for; only "true" turns it on
steps:
  - action: create
    version: "0.8.6"
    annotations:
      serving.modelsphere.dev/skip-schema-validation: "true"
  - action: reconcile
    expect:
      installs: 1
      lastSkipSchemaValidation: true
      phase: Applied
  - action: update
    annotations:
      serving.modelsphere.dev/skip-schema-validation: "yes"
    layers:
      - name: site
        values: '{"replicaCount":2}'
    expect:
      generation: 2
  - action: reconcile
    expect:
      upgrades: 1
      lastSkipSchemaValidation: false
