name: a-restart-resumes-the-recorded-stage
description: a restart resumes the recorded stage
steps:
  - action: create
    version: "0.8.6"
    finalizers:
      - serving.modelsphere.dev/finalizer
  - action: putRelease
    release:
      owned: true
      revision: 1
      status: deployed
  - action: setStatus
    status:
      phase: Deleting
      chartName: sglang
      deletion:
        stage: PodsTerminating
        outcome: NoRoute
        startedAt: -1m
        uninstalledAt: -30s
  - action: addPod
    pod:
      name: engine
      phase: Running
  - action: delete
  - action: freshReconciler
  - action: reconcile
    expect:
      uninstalls: 0
      phase: Deleting
      finalizer: present
      requeue:
        exact: 5s
      deletion:
        stage: PodsTerminating
        outcome: NoRoute
        podsRemaining: 1
        uninstalledAt: true
