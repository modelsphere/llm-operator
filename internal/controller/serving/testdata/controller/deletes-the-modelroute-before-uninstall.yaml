name: deletes-the-modelroute-before-uninstall
description: deletes the ModelRoute before uninstall
steps:
  - action: create
    version: "0.8.6"
    finalizers:
      - serving.modelsphere.dev/finalizer
  - action: putRelease
    release:
      owned: true
      revision: 1
      status: deployed
      manifest: |
        apiVersion: routing.modelsphere.dev/v1alpha1
        kind: ModelRoute
        metadata:
          name: qwen
  - action: addRoute
    route:
      name: qwen
      finalizers:
        - routing.modelsphere.dev/cleanup
  - action: delete
  - action: reconcile
    expect:
      uninstalls: 0
      phase: Deleting
      finalizer: present
      requeue:
        exact: 5s
      deletion:
        stage: RouteRemoving
        message:
          equals: waiting for ModelRoute qwen to be removed
      route:
        deleting: true
        finalizers:
          - routing.modelsphere.dev/cleanup
      eventsContain:
        - RouteRemoving
