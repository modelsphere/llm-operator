# The first sync defers a scale-up (wanted 2) while the deployment rolls out.
# Deleting the target records TargetNotFound on AbleToScale without clearing
# deferredSince, ScalingActive, or the replica counts already written.
# The delete does not change metadata.generation, so ScalingActive's
# observedGeneration from the first sync is still current. The reason staying
# MetricsAvailable is what shows the read path did not rewrite it.
"name": "should-report-target-not-found-and-leave-the-deferral-untouched"
"description": "should report TargetNotFound and leave the deferral untouched"
"inputs":
  "rollout": true
  "steps":
  - "by": "deferring the scale-up and stamping deferredSince"
    "at": "0s"
  - "by": "deleting the target and reconciling again"
    "at": "10s"
    "deleteDeploy": true
"expected":
  "steps":
  - "replicas": 1
    "desired": 2
    "applied": 1
    "current": 1
    "deferredSince": "0s"
    "requeueAfter": "15s"
    "condition":
      "status": "True"
      "reason": "RolloutInProgress"
      "messageContains":
      - "holding 1 replicas (wanted 2)"
      - "Deployment rollout in progress"
      - "will apply after 600s"
      "observedGenerationCurrent": true
    "active":
      "status": "True"
      "reason": "MetricsAvailable"
      "messageContains":
      - "evaluated 1 of 1 metrics"
      - "recommends 2 replicas"
      "observedGenerationCurrent": true
    "lastScaleTime": "unset"
    "observedGenerationCurrent": true
  - "desired": 2
    "applied": 1
    "current": 1
    "deferredSince": "0s"
    "requeueAfter": "10s"
    "condition":
      "status": "False"
      "reason": "TargetNotFound"
      "messageContains":
      - "not found"
      "observedGenerationCurrent": true
    "active":
      "status": "True"
      "reason": "MetricsAvailable"
      "messageContains":
      - "recommends 2 replicas"
      "observedGenerationCurrent": true
    "lastScaleTime": "unset"
    "observedGenerationCurrent": true
