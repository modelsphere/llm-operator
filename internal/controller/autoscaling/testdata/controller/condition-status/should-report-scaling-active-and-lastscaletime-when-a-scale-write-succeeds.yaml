# ceil(1 * 0.85/0.5) = ceil(1.7) = 2. The mock sample is 0.85 and the target is 0.5.
"name": "should-report-scaling-active-and-lastscaletime-when-a-scale-write-succeeds"
"description": "should report ScalingActive and lastScaleTime when a scale write succeeds"
"inputs":
  "steps":
  - "by": "scaling the deployment"
    "at": "0s"
"expected":
  "steps":
  - "replicas": 2
    "desired": 2
    "applied": 2
    "current": 1
    "requeueAfter": "15s"
    "condition":
      "status": "True"
      "reason": "Synced"
      "messageContains":
      - "scaled 1 -> 2"
      "observedGenerationCurrent": true
    "decision":
      "status": "True"
      "reason": "MetricsAvailable"
      "messageContains":
      - "evaluated 1 of 1 metrics"
      - "recommends 2 replicas"
      "observedGenerationCurrent": true
    "lastScaleTime": "set"
    "observedGenerationCurrent": true
