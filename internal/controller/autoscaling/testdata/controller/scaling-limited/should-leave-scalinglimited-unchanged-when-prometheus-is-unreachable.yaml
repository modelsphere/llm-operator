# The first sync records DesiredWithinRange. Closing Prometheus makes
# ScalingActive False, and raising maxReplicas bumps generation, so a
# rewritten ScalingLimited would carry the new generation. It keeps the old one.
"name": "should-leave-scalinglimited-unchanged-when-prometheus-is-unreachable"
"description": "should leave ScalingLimited unchanged when Prometheus is unreachable"
"inputs":
  "metric": "0.5"
  "steps":
  - "by": "recording DesiredWithinRange from a usable signal"
    "at": "0s"
  - "by": "losing Prometheus and bumping generation"
    "at": "0s"
    "closeServer": true
    "maxReplicas": 9
"expected":
  "steps":
  - "replicas": 1
    "desired": 1
    "limited":
      "status": "False"
      "reason": "DesiredWithinRange"
      "messageContains":
      - "the desired count is within the acceptable range"
      "observedGenerationCurrent": true
    "decision":
      "status": "True"
      "reason": "MetricsAvailable"
  - "replicas": 1
    "desired": 1
    "generationGreaterThan": 1
    "decision":
      "status": "False"
      "reason": "DecisionUnavailable"
      "messageContains":
      - "no prometheus metric could be evaluated"
      "observedGenerationCurrent": true
    "condition":
      "status": "True"
      "reason": "Synced"
      "messageContains":
      - "already at the step target"
    "limited":
      "status": "False"
      "reason": "DesiredWithinRange"
      "messageContains":
      - "the desired count is within the acceptable range"
      "observedGenerationStale": true
