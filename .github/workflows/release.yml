# Publish: the operator image and the Helm chart, at one version.
#
#   push to main      <appVersion>-git<sha7>
#   tag v<X>          <X>, which must be dist/chart/Chart.yaml's appVersion; the image is also latest
#   pull request      build, lint and package; nothing pushed
#   workflow_dispatch build, lint and package; nothing pushed
#
# The image goes to Docker Hub (4pdosc/llm-operator) and to GHCR
# (ghcr.io/<owner>/llm-operator); the chart goes to the GHCR OCI registry.
#
# Needs two repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
# GHCR authenticates with the workflow's GITHUB_TOKEN, so no extra secrets
# are needed for it.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: 4pdosc/llm-operator

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PUSH: ${{ github.event_name == 'push' }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        id: v
        run: |
          set -eu
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          app=$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}/\1/p' dist/chart/Chart.yaml)
          ghcr_image="ghcr.io/$owner/llm-operator"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
            # A prerelease (0.4.0-rc1) is a candidate for the release it names,
            # so the gate compares the version core and ignores the suffix --
            # otherwise the only way to rehearse this workflow is to cut the
            # real release.
            if [ "${version%%-*}" != "$app" ]; then
              echo "tag ${GITHUB_REF_NAME}, but dist/chart/Chart.yaml appVersion is $app" >&2
              echo "bump dist/chart/Chart.yaml before tagging" >&2
              exit 1
            fi
            tags="$IMAGE:$version,$ghcr_image:$version"
            # latest is what someone gets when they ask for no version in
            # particular, so a candidate must never take it. Both registries
            # get the same tag set.
            case "$version" in
              *-*) echo "prerelease $version: not tagging latest" >&2 ;;
              *)   tags="$tags,$IMAGE:latest,$ghcr_image:latest" ;;
            esac
          else
            version="$app-git${GITHUB_SHA:0:7}"
            tags="$IMAGE:$version,$ghcr_image:$version"
          fi
          {
            echo "version=$version"
            echo "tags=$tags"
            echo "charts=oci://ghcr.io/$owner/charts"
          } >>"$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.v.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Package the chart
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -eu
          helm lint --strict dist/chart
          helm package dist/chart --version "$VERSION" --app-version "$VERSION" --destination dist

      - name: Push the chart
        if: env.PUSH == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
          CHARTS: ${{ steps.v.outputs.charts }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          printf '%s' "$TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "dist/llmscaleoperator-$VERSION.tgz" "$CHARTS"
