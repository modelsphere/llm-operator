apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-vllm
  labels:
    app: {{ .Release.Name }}-vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-vllm
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-vllm
    spec:
      # Upper bound for graceful shutdown: preStop drain + in-flight request
      # completion must finish within this window, else the pod is SIGKILLed.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
      - name: vllm
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
        args:
          - "--model=/data/models"
          - "--served-model-name={{ .Values.model.name }}"
          - "--host=0.0.0.0"
          - "--port=8000"
          - "--max-model-len={{ .Values.model.maxLen }}"
        ports:
        - containerPort: 8000
          name: http
        volumeMounts:
        - name: model-storage
          mountPath: /data/models
          readOnly: true
        resources:
          limits:
            nvidia.com/gpu: "{{ .Values.model.gpus }}"
        {{- if .Values.lifecycle.preStop.enabled }}
        lifecycle:
          preStop:
            # Runs before SIGTERM. Sleeping here keeps vLLM serving while the
            # pod is being removed from the Service endpoints, so the router
            # stops sending NEW requests and in-flight ones can drain. No
            # dependency on an external drain API.
            exec:
              command: ["/bin/sh", "-c", "sleep {{ .Values.lifecycle.preStop.drainSeconds }}"]
        {{- end }}
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 5
      volumes:
      - name: model-storage
        hostPath:
          path: {{ .Values.model.localPath }}
          type: DirectoryOrCreate
