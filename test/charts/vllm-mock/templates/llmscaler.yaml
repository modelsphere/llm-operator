{{- if .Values.scaler.enabled -}}
apiVersion: autoscaling.4pd.io/v1alpha1
kind: LLMScaler
metadata:
  name: {{ .Release.Name }}-scaler
spec:
  syncPeriodSeconds: {{ .Values.scaler.syncPeriodSeconds }}
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-vllm
  serverType: {{ .Values.scaler.serverType }}
  {{- if .Values.metricsMock.enabled }}
  # Driven by the metrics-mock (returns a fixed value) to simulate scaling.
  serverAddress: "http://{{ .Release.Name }}-metrics-mock.{{ .Release.Namespace }}:9090"
  {{- else }}
  serverAddress: {{ .Values.scaler.serverAddress | quote }}
  {{- end }}
  {{- with .Values.scaler.selector }}
  selector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.scaler.serverHeaders }}
  serverHeaders:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  minReplicas: {{ .Values.scaler.minReplicas }}
  maxReplicas: {{ .Values.scaler.maxReplicas }}
  metrics:
    {{- toYaml .Values.scaler.metrics | nindent 4 }}
  {{- with .Values.scaler.scaleDown }}
  scaleDown:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end -}}
