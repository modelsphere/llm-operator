# Replicas the Deployment starts with. Once the LLMScaler is running it owns
# spec.replicas, so this is only the starting point -- the real bounds are
# scaler.minReplicas / scaler.maxReplicas.
replicaCount: 1

image:
  repository: "vllm/vllm-openai"
  tag: "latest-cu129-ubuntu2404"

model:
  # The Hugging Face repo ID
  name: "facebook/opt-125m"
  # Where the models are cached on the host node
  localPath: "/mnt/disk0/models/facebook/opt-125m"
  # Leave empty to omit --max-model-len entirely and let vLLM use the model's
  # own. Only pin it when you really mean to cap the context.
  maxLen: "1024"
  gpus: "1"

# Extra vLLM server flags, appended verbatim to the command line (e.g.
# --tensor-parallel-size=2). The chart already emits --model,
# --served-model-name, --host, --port and --shutdown-timeout, so do not repeat
# those here.
extraArgs: []

service:
  type: ClusterIP
  # The inference and /metrics port. Threaded through the container port, the
  # Service, the readiness probe, vLLM's --port flag and the preStop drain URL,
  # so changing it here is enough.
  port: 8000

# Graceful shutdown / cache-aware scale-down draining.
#
# A pod being deleted goes through two stages, and both come out of the same
# timer, which starts the moment the pod is marked Terminating:
#
#   1. preStop  -- up to endpointSyncSeconds + drainSeconds
#   2. SIGTERM  -- up to lifecycle.shutdownTimeout (vLLM finishing up)
#
# If the two together do not fit in terminationGracePeriodSeconds, the kubelet
# kills the pod partway through and any request still running dies with it. The
# chart checks this when it renders, so a bad combination fails `helm install`
# instead of quietly dropping requests later.
terminationGracePeriodSeconds: 60
lifecycle:
  preStop:
    enabled: true
    # Stage 1a: keep serving while the cluster takes this pod out of the load
    # balancer (Cilium, kube-proxy, ...), so no new requests are sent here.
    #
    # This always waits the full time. Kubernetes starts removing the pod from
    # the load balancer and runs this hook AT THE SAME TIME, not one after the
    # other, and the pod has no way to check whether that removal finished yet.
    #
    # Set it to however long whatever routes traffic here needs to notice. Cilium
    # suggests ~1s for a ClusterIP Service and ~10s if an external load balancer
    # is in front; 5 is a safe middle default.
    endpointSyncSeconds: 5
    # Stage 1b: how long to wait, at most, for requests already accepted to
    # finish. The hook watches vLLM's own metrics and moves on as soon as the
    # server goes idle, so a quiet pod shuts down in about endpointSyncSeconds
    # instead of always waiting this long.
    drainSeconds: 30
    # How often to re-check whether vLLM has gone idle.
    pollIntervalSeconds: 2
  # Stage 2: vLLM's own --shutdown-timeout. Once SIGTERM arrives, vLLM defaults
  # to 0, which KILLS anything still running -- the preStop hook above cannot
  # help a request that ran past its budget. Setting this above zero lets those
  # last requests finish. Needs vLLM >= 0.18.0; use 0 to leave the flag off
  # (older images, or to keep vLLM's default of killing on SIGTERM).
  shutdownTimeout: 15

scaler:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  syncPeriodSeconds: 10
  # Prometheus scrapes vLLM via the serviceMonitor below.
  # Prometheus query endpoint (the /api/v1/query base). Adjust to your cluster;
  # this is the headless Service the Prometheus Operator creates by default.
  serverAddress: "http://prometheus-operated.monitoring.svc:9090"
  # Optional HTTP headers for the metrics query (e.g. auth for a secured
  # Prometheus). Empty for a typical in-cluster Prometheus.
  serverHeaders: {}
  # Each metric is a PromQL query (returning a single averaged value) plus a
  # per-replica target. Scaling compares them as
  # ceil(readyReplicas * value / target). Bake label filters into the query.
  # The __SCOPE__ token expands to namespace="<ns>", app="<release>-vllm", scoping
  # the query to THIS deployment's pods — important when several deployments (even
  # same-named releases in different namespaces) serve the same model.
  # A short avg_over_time window keeps the signal robust to a missed scrape and
  # filters single-sample spikes; keep it short (~1m) so scale-up stays fast —
  # scale-down conservatism belongs in scaleDown.stabilizationWindowSeconds.
  metrics:
    # Queue depth (requests waiting per replica). This is the signal that
    # actually moves under real load on a small model — its KV cache barely
    # fills, but requests queue once concurrency exceeds vLLM's max-num-seqs.
    # Scale up when the average waiting requests per replica exceeds target.
    - name: queue-depth
      query: 'avg(avg_over_time(vllm:num_requests_waiting{__SCOPE__}[1m]))'
      target: "5"
  # Cache-aware scale-down. deletionCostQuery is a PromQL instant query that
  # returns one series per pod (carrying a "pod" label); its value becomes that
  # pod's controller.kubernetes.io/pod-deletion-cost (lower = deleted first), so
  # colder pods should yield lower numbers. Evaluated against serverAddress at
  # scale-down time. Leave empty to use the built-in newest-pod-first heuristic.
  # Keep empty when metricsMock is enabled (the mock has no per-pod "pod" label).
  scaleDown:
    behavior: CacheAware
    # Hold at the highest recommendation over this window before scaling down, so
    # a brief metric dip doesn't cause flapping (scale-up stays immediate).
    # 0 disables it (keeps the metricsMock demo snappy); set e.g. 300 in prod.
    stabilizationWindowSeconds: 0
    deletionCostQuery: ""
    # Example (scoped to this deployment via __SCOPE__):
    #   deletionCostQuery: 'vllm:kv_cache_usage_perc{__SCOPE__} * 100'

# Deterministic scale-op simulation. When enabled, the scaler queries this mock
# instead of real Prometheus, so you can drive scaling by hand: set `value`
# above the target (e.g. 10 vs target 5) to scale toward maxReplicas, below it
# (e.g. 0) to scale toward minReplicas. Note: the value is static regardless
# of replica count, so it pegs to the min/max bound rather than settling.
metricsMock:
  enabled: false
  image: "hashicorp/http-echo:0.2.3"
  # The value the mock returns for the metric query (compared against target).
  value: "10"

serviceMonitor:
  # Requires the Prometheus Operator CRDs (monitoring.coreos.com) to be installed.
  enabled: true
  # vLLM exposes Prometheus metrics on the inference port at /metrics
  path: /metrics
  interval: 15s
  scrapeTimeout: 10s
  # Extra labels so the cluster's Prometheus serviceMonitorSelector picks it up,
  # e.g. { release: kube-prometheus-stack }
  labels:
    release: kube-prometheus-stack
  # Pod labels copied onto the scraped series. `app` lets metric queries scope to
  # a single deployment (app="<release>-vllm") when several serve the same model.
  podTargetLabels:
    - app

# Additional environment variables on the vLLM container.
env: []
  # - name: HF_TOKEN
  #   valueFrom:
  #     secretKeyRef:
  #       name: huggingface
  #       key: token

# Additional volumes on the output Deployment definition. The model volume built
# from model.localPath is always mounted; these are added alongside it.
volumes: []
  # - name: shm
  #   emptyDir:
  #     medium: Memory
  #     sizeLimit: 8Gi

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
  # - name: shm
  #   mountPath: /dev/shm

# Pin the GPU pods to particular nodes. `affinity` is the place for node
# affinity / anti-affinity rules; nodeSelector and tolerations are the simpler
# forms of the same idea.
nodeSelector: {}

tolerations: []

affinity: {}
