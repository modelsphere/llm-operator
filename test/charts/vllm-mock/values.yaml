image:
  repository: "vllm/vllm-openai"
  tag: "latest-cu129-ubuntu2404"

model:
  # The Hugging Face repo ID
  name: "facebook/opt-125m"
  # Where the models are cached on the host node
  localPath: "/mnt/disk0/models/facebook/opt-125m"
  maxLen: "1024"
  gpus: "1"

# Graceful shutdown / cache-aware scale-down draining.
# Must be >= lifecycle.preStop.drainSeconds plus the longest in-flight request.
terminationGracePeriodSeconds: 60
lifecycle:
  preStop:
    enabled: true
    # Seconds vLLM keeps serving after termination starts, so the pod is
    # dropped from Service endpoints (no new requests) and in-flight requests
    # drain before SIGTERM is delivered.
    drainSeconds: 30

scaler:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  syncPeriodSeconds: 10
  serverAddress: "http://llm-monitor.llm-monitor.svc:8080"
  targetKVCache: "80%"
  # Extra HTTP headers sent with each metric-fetch request (e.g. auth for llm-monitor)
  serverHeaders:
    Authorization: "Basic YWRtaW46NHBkYWRtaW4yMDI2IQ=="

serviceMonitor:
  # Requires the Prometheus Operator CRDs (monitoring.coreos.com) to be installed.
  enabled: false
  # vLLM exposes Prometheus metrics on the inference port at /metrics
  path: /metrics
  interval: 15s
  scrapeTimeout: 10s
  # Extra labels so the cluster's Prometheus serviceMonitorSelector picks it up,
  # e.g. { release: kube-prometheus-stack }
  labels: {}
